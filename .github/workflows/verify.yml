name: Verify ProductStat
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env: {POSTGRES_DB: productstat, POSTGRES_USER: productstat, POSTGRES_PASSWORD: ci_only_password}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U productstat" --health-interval 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: productstat
      PGUSER: productstat
      PGPASSWORD: ci_only_password
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-secret-never-used-for-real-deployments-123456789
      PRODUCTSTAT_DEMO: '1'
      CELERY_TASK_ALWAYS_EAGER: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.lock.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run && pytest -q
        working-directory: backend
      - run: python manage.py migrate --noinput && python manage.py seed_demo --small
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: python manage.py spectacular --file ../docs/openapi.yaml --validate --fail-on-warn
        working-directory: backend
      - run: npx openapi-typescript ../docs/openapi.yaml -o src/lib/schema.d.ts
        working-directory: frontend
      - run: npm run typecheck && npm run format:check && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- docs/openapi.yaml frontend/src/lib/schema.d.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          (cd backend && CELERY_TASK_ALWAYS_EAGER=0 python manage.py runserver 127.0.0.1:8001 --noreload) > /tmp/productstat-api.log 2>&1 &
          (cd frontend && npm run start) > /tmp/productstat-ui.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/; then break; fi
            sleep 1
          done
      - run: bash scripts/async-check.sh
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            docs/screenshots
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t productstat-backend .
      - run: docker build -f frontend/Dockerfile -t productstat-frontend .
      - run: docker build -f deploy/backup.Dockerfile -t productstat-backup .
