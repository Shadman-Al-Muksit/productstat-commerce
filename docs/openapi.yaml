components:
  schemas:
    Address:
      type: object
      properties:
        line1:
          type: string
        city:
          type: string
        area:
          type: string
        postal_code:
          type: string
      required:
      - city
      - line1
    AnalyticsResponse:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/ReportingFilters'
        summary:
          $ref: '#/components/schemas/ReportingSummary'
        cohort:
          $ref: '#/components/schemas/ReportingCohort'
        cash:
          $ref: '#/components/schemas/ReportingCash'
        delivery:
          $ref: '#/components/schemas/ReportingDelivery'
        comparison:
          $ref: '#/components/schemas/ReportingComparison'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/ReportingTrend'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ReportingProduct'
        meta:
          $ref: '#/components/schemas/ReportingMeta'
        return_reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReturnReason'
        coverage:
          $ref: '#/components/schemas/ReportingCoverage'
      required:
      - cash
      - cohort
      - comparison
      - coverage
      - delivery
      - filters
      - meta
      - products
      - return_reasons
      - summary
      - trend
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event:
          type: string
        entity:
          type: string
        reference:
          type: string
        details:
          type: object
          additionalProperties: {}
        actor:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - actor
      - created_at
      - details
      - entity
      - event
      - id
      - reference
    AuditList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Audit'
      required:
      - results
    AuthResult:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
        csrfToken:
          type: string
      required:
      - csrfToken
      - user
    Batch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          maxLength: 30
        status:
          type: string
          maxLength: 30
        filename:
          type: string
          maxLength: 250
        source_name:
          type: string
          maxLength: 100
        progress:
          type: integer
          maximum: 2147483647
          minimum: 0
        total_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        valid_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        error_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        errors: {}
        preview: {}
        result: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        committed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - filename
      - id
      - kind
      - source_name
    BatchList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
      required:
      - results
    Bootstrap:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
        company:
          $ref: '#/components/schemas/Company'
        csrfToken:
          type: string
        delivery_zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
        payment:
          $ref: '#/components/schemas/PaymentConfiguration'
        demo:
          type: boolean
      required:
      - company
      - csrfToken
      - delivery_zones
      - demo
      - payment
      - user
    CallbackInput:
      type: object
      properties:
        tran_id:
          type: string
        val_id:
          type: string
        status:
          type: string
      required:
      - tran_id
      - val_id
    CallbackResult:
      type: object
      properties:
        status:
          type: string
        order_id:
          type: string
          format: uuid
      required:
      - order_id
      - status
    CancelInput:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuantityInput'
    CartInput:
      type: object
      properties:
        sku_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 100
          minimum: 0
      required:
      - quantity
      - sku_id
