      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResult'
          description: ''
    post:
      operationId: cart_post
      tags:
      - Commerce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartInput'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResult'
          description: ''
    delete:
      operationId: cart_delete
      tags:
      - Commerce
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResult'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: catalog_get
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at one.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page; maximum 100 for operational lists.
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - name
          - newest
          - price_asc
          - price_desc
      tags:
      - Commerce
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
          description: ''
  /api/v1/catalog/products/{slug}/:
    get:
      operationId: catalog_detail_get
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Commerce
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/checkout/:
    post:
      operationId: checkout_post
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - Commerce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checkout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Checkout'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_get
      tags:
      - Commerce
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/imports/:
    get:
      operationId: imports_list
      tags:
      - Imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
          description: ''
    post:
      operationId: imports_upload
      tags:
      - Imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Upload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/v1/imports/{batch_id}/:
    get:
      operationId: imports_detail
      parameters:
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
