      - in: query
        name: page
        schema:
          type: integer
        description: Page number, starting at one.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page; maximum 100 for operational lists.
      tags:
      - Commerce
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: order_detail_get
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: Guest order access token; prefer X-Order-Token header when available.
      tags:
      - Commerce
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/orders/{id}/cancel/:
    post:
      operationId: cancel_order_post
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: Guest order access token; prefer X-Order-Token header when available.
      tags:
      - Commerce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelInput'
      security:
