openapi: 3.0.3
info:
  title: ProductStat Commerce API
  version: 1.0.0
  description: Single-company commerce operations and trustworthy product analytics.
paths:
  /api/v1/analytics/:
    get:
      operationId: analytics_overview
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: query
        name: product_ids
        schema:
          type: string
        description: Comma-separated UUIDs; at most 20.
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - Analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
          description: ''
  /api/v1/analytics/drilldown/:
    get:
      operationId: analytics_drilldown
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: query
        name: metric
        schema:
          type: string
          enum:
          - cancelled_units
          - delivered_units
          - ordered_units
          - orders
          - refunds
          - returned_units
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: product_ids
        schema:
          type: string
        description: Comma-separated UUIDs; at most 20.
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - Analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrilldownResponse'
          description: ''
  /api/v1/analytics/export/:
    get:
      operationId: analytics_export
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: query
        name: metric
        schema:
          type: string
          enum:
          - cancelled_units
          - delivered_units
          - ordered_units
          - orders
          - refunds
          - returned_units
      - in: query
        name: product_ids
        schema:
          type: string
        description: Comma-separated UUIDs; at most 20.
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - Analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: Redacted rows using the same filter as drill-down.
  /api/v1/analytics/variants/:
    get:
      operationId: analytics_variants
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: query
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - Analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: login_view_post
      tags:
      - Commerce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: logout_view_post
      tags:
      - Commerce
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
