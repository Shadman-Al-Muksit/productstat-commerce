            $ref: '#/components/schemas/User'
      required:
      - results
    VariantFilters:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        timezone:
          type: string
        currency:
          type: string
      required:
      - currency
      - end
      - product_id
      - start
      - timezone
    VariantProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    VariantResponse:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/VariantProduct'
        filters:
          $ref: '#/components/schemas/VariantFilters'
        results:
          type: array
          items:
            $ref: '#/components/schemas/VariantRow'
      required:
      - filters
      - product
      - results
    VariantRow:
      type: object
      properties:
        sku_id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        is_active:
          type: boolean
        ordered_units:
          type: integer
        cancelled_units:
          type: integer
        delivered_units:
          type: integer
        returned_units:
          type: integer
        delivered_value:
          type: string
        returned_value:
          type: string
        refunded_amount:
          type: string
        net_delivered_value:
          type: string
      required:
      - cancelled_units
      - code
      - delivered_units
      - delivered_value
      - is_active
      - label
      - net_delivered_value
      - ordered_units
      - refunded_amount
      - returned_units
      - returned_value
      - sku_id
    Zone:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - charge
      - id
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
