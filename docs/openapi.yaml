          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionPreview'
          description: ''
  /api/v1/imports/templates/:
    get:
      operationId: imports_template
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - adjustments
          - catalog
          - history
          - lines
          - opening_stock
          - orders
          - payments
          - refunds
          - returns
          - shipments
      tags:
      - Imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: CSV header template.
  /api/v1/orders/:
    get:
      operationId: orders_get
