        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CorrectionInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorrectionInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
